# Builds the application firmware and the SD-card update package.
#
#   push / pull request : build, upload package as a workflow artifact
#   tag v<base>-cy.<build> (e.g. v1.01-cy.1) : publish a GitHub Release; the tag must
#                            match the version CMake derives from Global.h + VERSION,
#                            notes come from the matching CHANGELOG.md section

name: Build firmware

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  ARM_GCC_VERSION: 14.2.rel1
  APP_DIR: 02 Software/Drumboy-Pro-App-H723

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Arm GNU toolchain
        id: cache-gcc
        uses: actions/cache@v4
        with:
          path: ~/arm-gnu-toolchain
          key: arm-gnu-toolchain-${{ env.ARM_GCC_VERSION }}-linux-x86_64

      - name: Install Arm GNU toolchain
        if: steps.cache-gcc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/arm-gnu-toolchain
          curl -fsSL "https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_GCC_VERSION}/binrel/arm-gnu-toolchain-${ARM_GCC_VERSION}-x86_64-arm-none-eabi.tar.xz" \
            | tar -xJ -C ~/arm-gnu-toolchain --strip-components=1

      - name: Install Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Build (Debug preset, release build)
        working-directory: ${{ env.APP_DIR }}
        run: |
          export PATH="$HOME/arm-gnu-toolchain/bin:$PATH"
          cmake --preset Debug
          cmake --build --preset Debug

      - name: Check version
        id: version
        run: |
          ver="$(tr -d '[:space:]' < "$APP_DIR/build/Debug/version.txt")"
          echo "Firmware version $ver"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$ver" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match firmware version $ver. Bump VERSION first."; exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Build (Stock, CpuMeter and PluginDev presets)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: ${{ env.APP_DIR }}
        run: |
          export PATH="$HOME/arm-gnu-toolchain/bin:$PATH"
          for preset in Stock CpuMeter PluginDev; do
            cmake --preset $preset
            cmake --build --preset $preset
          done

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: drumboy-pro-firmware-${{ github.sha }}
          path: |
            ${{ env.APP_DIR }}/build/*/Drumboy_Pro_Fw_*.bin
            ${{ env.APP_DIR }}/build/*/Drumboy-Pro-App-H723.elf
            ${{ env.APP_DIR }}/build/*/Drumboy-Pro-App-H723.map

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${{ steps.version.outputs.version }}"
          {
            awk -v v="$ver" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md
            echo
            echo "**Install:** copy \`Drumboy_Pro_Fw_*.bin\` to the root of the SD card (no other firmware file there) and power-cycle the Drumboy."
            echo "To go back to stock, do the same with the official package from \`02 Software/Firmware/\`."
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            "$APP_DIR"/build/Debug/Drumboy_Pro_Fw_*.bin \
            --title "Drumboy Pro $ver (cyberyak build ${ver##*-cy.}, based on Randomwaves ${ver%%-*})" \
            --notes-file release-notes.md
